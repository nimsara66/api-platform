roles:
  - name: ap_admin
    scopes:
      - dp:organization:manage
      - dp:organization_content:manage
      - dp:api:manage
      - dp:api_content:manage
      - dp:mcp_server:manage
      - dp:mcp_server_content:manage
      - dp:api_workflow:manage
      - dp:api_key:manage
      - dp:mcp_server_key:manage
      - dp:application:manage
      - dp:application_key:manage
      - dp:application_key:revoke
      - dp:application_key_mapping:manage
      - dp:subscription:manage
      - dp:subscription_plan:manage
      - dp:key_manager:manage
      - dp:key_manager:read
      - dp:view:manage
      - dp:label:manage
      - dp:webhook_subscriber:manage
      - dp:event:read

  # This role has application creation in the issuer's scopes but is read-only
  # in the Portal mapping, proving the distinction between scope and role mode.
  - name: dp_narrow_it
    scopes:
      - dp:organization:read
      - dp:api:read
      - dp:mcp_server:read
      - dp:application:create
      - dp:application:read
      - dp:subscription:read
      - dp:api_key:read

  # These identities are declared by the shared file-auth test overlay. They are
  # not used by the authorization scenarios, but must remain valid configuration.
  - name: ap_subscriber
    scopes: []

  - name: ap_publisher
    scopes: []
